# Phase 7 correction — split shared jwt-secret into per-service SM paths.
# Ops: migrate SM secret
#   /localy/prod/workload/jwt-secret.clientSecret      → /localy/prod/workload/user-oauth
#   /localy/prod/workload/jwt-secret.edgeClientSecret  → /localy/prod/workload/edge-oauth
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: user-jwt-secrets
  namespace: user-service
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
    localy.io/phase: "7-correction"
    localy.io/sm-migration: "from:/localy/prod/workload/jwt-secret#clientSecret"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: platform-secret-store
    kind: SecretStore
  target:
    name: localy-user-keycloak-secret
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      data:
        # application.yml uses registration "keycloak" + ${KEYCLOAK_CLIENT_SECRET}
        KEYCLOAK_CLIENT_SECRET: "{{ .clientSecret }}"
        keycloak.client-secret: "{{ .clientSecret }}"
        spring.security.oauth2.client.registration.keycloak.client-secret: "{{ .clientSecret }}"
  data:
    - secretKey: clientSecret
      remoteRef:
        key: /localy/prod/workload/user-oauth
        property: clientSecret
