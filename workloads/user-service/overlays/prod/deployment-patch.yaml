apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-service
  namespace: user-service
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  template:
    spec:
      terminationGracePeriodSeconds: 45
      # ALB target-health gate only applies when TargetGroupBinding exists (edge entry).
      readinessGates: []
      containers:
        - name: app
          resources:
            requests:
              cpu: "200m"
              memory: "512Mi"
            limits:
              memory: "512Mi"
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 15"]
          envFrom:
            - configMapRef:
                name: user-service-config
          volumeMounts:
            - name: secret-volume
              mountPath: /workspace/configtree
              readOnly: true
      volumes:
        - name: secret-volume
          secret:
            secretName: localy-user-keycloak-secret
