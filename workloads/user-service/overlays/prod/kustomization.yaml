apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - pod-disruption-budget.yaml
  - service-monitor.yaml
  - service-account.yaml
  - secret-store.yaml
  - external-secret.yaml
  - configmap.yaml
  - network-policy.yaml
  - ../../base

patches:
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: user-service
      namespace: user-service
    path: deployment-patch.yaml
  - target:
      version: v1
      kind: Service
      name: user-service-svc
      namespace: user-service
    path: service-patch.yaml

images:
  - name: localy/user-service
    newName: 533003975005.dkr.ecr.ap-northeast-2.amazonaws.com/user-service
    newTag: e2e1
