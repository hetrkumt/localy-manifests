apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base
  - pod-disruption-budget.yaml
  - service-monitor.yaml
  - service-account.yaml
  - secret-store.yaml
  - external-secret.yaml
  - configmap.yaml
  - network-policy.yaml
  - scaled-object.yaml
  - resource-guards.yaml

patches:
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: user-service
      namespace: user-service
    path: deployment-patch.yaml
  - target:
      version: v1
      kind: Service
      name: user-service-svc
      namespace: user-service
    path: service-patch.yaml

# Image pin SSOT: workloads/image-pins.yaml (keep newTag in sync)
images:
  - name: localy/user-service
    newName: 533003975005.dkr.ecr.ap-northeast-2.amazonaws.com/user-service
    newTag: sha-42def0a1cdc4
