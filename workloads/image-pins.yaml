# =============================================================================
# Prod workload image tag SSOT
# =============================================================================
# Deploy pins live in:
#   workloads/<svc>/overlays/prod/kustomization.yaml  ?? images[].newTag
# Those newTag values MUST match `services` below.
#
# Architecture: linux/amd64 only.
#   - CI: docker buildx --platform linux/amd64
#   - Karpenter NodePool "workload": kubernetes.io/arch=amd64 (no Graviton)
#   - Pods/Jobs: nodeSelector kubernetes.io/arch=amd64
#
# CI (localy-backend .github/workflows/build-push-ecr.yml) pushes:
#   - each gitops pin tag listed here
#   - mutable alias `latest` (convenience only ??NOT used by GitOps)
#
# After teardown / empty ECR:
#   1) Fix TF OIDC+ECR push IAM if needed (l3 github_actions_oidc.tf)
#   2) Run workflow_dispatch "Build and Push to Amazon ECR" on main
#   3) Or: localy/infrastructure/scripts/rebuild-ecr-image-pins.ps1 -Execute
#   4) Verify: localy/infrastructure/scripts/check-ecr-image-pins.ps1
# =============================================================================
registry: 533003975005.dkr.ecr.ap-northeast-2.amazonaws.com
region: ap-northeast-2
architecture: amd64
services:
  order-service: sha-aa0c6d33c9fe
  payment-service: sha-f39495f87b67
  cart-service: sha-f39495f87b67
  user-service: sha-f39495f87b67
  store-service: sha-f39495f87b67
  edge-service: sha-f39495f87b67
