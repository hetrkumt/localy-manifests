apiVersion: v1
kind: Service
metadata:
  name: edge-service
  labels:
    app: edge-service
spec:
  type: ClusterIP
  # ALB TargetGroupBinding readinessGates keep Pod Ready=False until TG healthy;
  # still allow Prometheus EndpointSlice membership for :9090 scrape.
  publishNotReadyAddresses: true
  selector:
    app: edge-service
  ports:
    - name: http
      port: 80
      targetPort: 9000
      protocol: TCP
    - name: management
      port: 9090
      targetPort: 9090
      protocol: TCP
