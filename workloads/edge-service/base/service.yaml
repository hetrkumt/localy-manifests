apiVersion: v1
kind: Service
metadata:
  name: edge-service
  labels:
    app: edge-service
spec:
  type: ClusterIP
  selector:
    app: edge-service
  ports:
    - name: http
      port: 80
      targetPort: 9000
      protocol: TCP
    - name: management
      port: 9090
      targetPort: 9090
      protocol: TCP
