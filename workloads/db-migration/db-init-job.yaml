# Phase 0 hardened: credentials only via Secret volume (0400). No plaintext passwords in Git.
# Monolithic db-init is scheduled for Agenda 3 decommission → per-service PreSync Flyway Jobs.
apiVersion: batch/v1
kind: Job
metadata:
  name: iam-db-init-strike-force
  namespace: payment-service
  annotations:
    localy.io/secret-policy: "volume-mount-only"
spec:
  ttlSecondsAfterFinished: 60
  backoffLimit: 2
  template:
    metadata:
      labels:
        app: payment-service
    spec:
      serviceAccountName: payment-service-sa
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - name: secret-volume
          secret:
            secretName: payment-service-secret
            defaultMode: 0400
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 32Mi
      containers:
        - name: psql-striker
          image: public.ecr.aws/docker/library/postgres:15-alpine
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "256m"
              memory: "256Mi"
          volumeMounts:
            - name: secret-volume
              mountPath: /etc/secrets
              readOnly: true
            - name: tmp
              mountPath: /tmp
          command:
            - "sh"
            - "-c"
            - |
              set -e
              URL=$(cat /etc/secrets/SPRING_DATASOURCE_URL)
              DB_URL=${URL#jdbc:postgresql://}
              DB_HOST_PORT=$(echo $DB_URL | cut -d'/' -f1)
              DB_HOST=$(echo $DB_HOST_PORT | cut -d':' -f1)
              DB_NAME_PARAMS=$(echo $DB_URL | cut -d'/' -f2)
              DB_NAME=$(echo $DB_NAME_PARAMS | cut -d'?' -f1)
              DB_USER=$(cat /etc/secrets/SPRING_DATASOURCE_USERNAME)

              until pg_isready -h $DB_HOST -U $DB_USER; do
                echo "Waiting for DB..."
                sleep 2
              done

              PGPASSWORD=$(cat /etc/secrets/SPRING_DATASOURCE_PASSWORD) psql -h $DB_HOST -U $DB_USER -d $DB_NAME -v ON_ERROR_STOP=1 -c "
                BEGIN;
                DO \$\$
                BEGIN
                  IF NOT EXISTS (SELECT FROM pg_catalog.pg_roles WHERE rolname = 'storeuser') THEN CREATE ROLE storeuser LOGIN; END IF;
                  IF NOT EXISTS (SELECT FROM pg_catalog.pg_roles WHERE rolname = 'orderuser') THEN CREATE ROLE orderuser LOGIN; END IF;
                  IF NOT EXISTS (SELECT FROM pg_catalog.pg_roles WHERE rolname = 'paymentuser') THEN CREATE ROLE paymentuser LOGIN; END IF;
                END
                \$\$;
                GRANT rds_iam TO storeuser, orderuser, paymentuser;
                GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA public TO storeuser, orderuser, paymentuser;
                GRANT USAGE, SELECT, UPDATE ON ALL SEQUENCES IN SCHEMA public TO storeuser, orderuser, paymentuser;
                ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT SELECT, INSERT, UPDATE, DELETE ON TABLES TO storeuser, orderuser, paymentuser;
                ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT USAGE, SELECT, UPDATE ON SEQUENCES TO storeuser, orderuser, paymentuser;
                COMMIT;
              "
      restartPolicy: Never
