apiVersion: v1
kind: Service
metadata:
  name: order-service
  labels:
    app: order-service
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 8091
      protocol: TCP
      name: http
    - name: management
      port: 9090
      targetPort: 9090
      protocol: TCP
  selector:
    app: order-service
