# Wave 3 — order-service Rollout (Deployment retired in Git SSOT)
# Canary is replica-weight based (no Ingress on order). ALB traffic shaping
# lives in common/components/alb-canary-routing for edge/gateway later.
#
# Cutover note (Gate 8A prune=false): after first Sync, delete orphan
# Deployment/order-service if it still exists so only the Rollout owns pods.
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: order-service
  labels:
    app: order-service
spec:
  replicas: 2
  revisionHistoryLimit: 3
  progressDeadlineSeconds: 900
  selector:
    matchLabels:
      app: order-service
  template:
    metadata:
      labels:
        app: order-service
        security.localy.io/zero-trust: "enforced"
    spec:
      serviceAccountName: order-service-sa
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: order-service
                topologyKey: kubernetes.io/hostname
      containers:
        - name: order-service
          image: localy-order-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8091
          env:
            - name: HOST_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
            - name: JAVA_OPTS
              value: "-XX:MaxRAMPercentage=75.0 -XX:+UseG1GC"
            - name: SPRING_CONFIG_IMPORT
              value: "optional:configtree:/mnt/secrets/app-creds/,optional:configtree:/mnt/config/"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10001
            capabilities:
              drop: ["ALL"]
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 25"]
          resources:
            requests:
              cpu: "100m"
              memory: "512Mi"
            limits:
              memory: "512Mi"
          # JVM boot budget isolated; readiness stays ≤5s for fast canary fail-fast
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 9090
            failureThreshold: 30
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 9090
            initialDelaySeconds: 0
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 9090
            initialDelaySeconds: 0
            periodSeconds: 10
            failureThreshold: 3
          volumeMounts:
            - name: secret-app-creds
              mountPath: /mnt/secrets/app-creds
              readOnly: true
            - name: tmp-volume
              mountPath: /tmp
      volumes:
        - name: secret-app-creds
          secret:
            secretName: order-service-secret
            defaultMode: 0400
        - name: tmp-volume
          emptyDir:
            medium: Memory
            sizeLimit: 64Mi
  strategy:
    canary:
      maxSurge: "25%"
      maxUnavailable: 0
      # scaleDownDelaySeconds requires trafficRouting; replica-weight canary omits it
      # Wave 4 — analysis between weight steps (auto-abort on SLI breach)
      steps:
        - setWeight: 5
        - analysis:
            templates:
              - templateName: spring-boot-http-success-rate
              - templateName: spring-boot-latency-check
            args:
              - name: namespace
                value: order-service
        - setWeight: 20
        - analysis:
            templates:
              - templateName: spring-boot-http-success-rate
              - templateName: spring-boot-latency-check
            args:
              - name: namespace
                value: order-service
        - setWeight: 50
        - analysis:
            templates:
              - templateName: spring-boot-http-success-rate
              - templateName: spring-boot-latency-check
            args:
              - name: namespace
                value: order-service
        - setWeight: 100
