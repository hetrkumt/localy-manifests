apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: order-service-network-policy
  namespace: order-service
spec:
  podSelector:
    matchLabels:
      app: order-service
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - protocol: TCP
          port: 9090
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: edge-service
      ports:
        - protocol: TCP
          port: 8091
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # EKS Pod Identity agent
    - to:
        - ipBlock:
            cidr: 169.254.170.23/32
      ports:
        - protocol: TCP
          port: 80
    - ports:
        - protocol: TCP
          port: 5432
        - protocol: TCP
          port: 443
    - ports:
        - protocol: TCP
          port: 9092
        - protocol: TCP
          port: 9098
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: payment-service
      ports:
        - protocol: TCP
          port: 80
