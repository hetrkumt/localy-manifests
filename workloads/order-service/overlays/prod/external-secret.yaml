apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: order-service-es
  namespace: order-service
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secret-store
    kind: SecretStore
  target:
    name: order-service-secret
    creationPolicy: Owner
    template:
      data:
        SPRING_DATASOURCE_URL: "jdbc:postgresql://{{ .host }}:{{ .port }}/orderdb?sslmode=require"
        SPRING_DATASOURCE_USERNAME: "{{ .username }}"
        SPRING_DATASOURCE_PASSWORD: "{{ .password }}"
        SPRING_KAFKA_BOOTSTRAP_SERVERS: "{{ .SPRING_KAFKA_BOOTSTRAP_SERVERS }}"
        DB_HOST: "{{ .host }}"
        DB_PORT: "{{ .port }}"
        DB_NAME: "orderdb"
        DB_USER: "{{ .username }}"
  data:
    - secretKey: host
      remoteRef:
        key: localy-prod-database-credentials
        property: host
    - secretKey: port
      remoteRef:
        key: localy-prod-database-credentials
        property: port
    - secretKey: username
      remoteRef:
        key: localy-prod-database-credentials
        property: username
    - secretKey: password
      remoteRef:
        key: localy-prod-database-credentials
        property: password
    - secretKey: SPRING_KAFKA_BOOTSTRAP_SERVERS
      remoteRef:
        key: /localy/prod/apps/msk/bootstrap_servers
