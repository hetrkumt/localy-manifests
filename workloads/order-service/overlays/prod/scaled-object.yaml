# Phase 5 — KEDA SSOT (MSK lag) — HPA retired
# Auth: KEDA assumes workload IRSA (order-service-sa role) via identityOwner=workload
# KEDA 2.14: apache-kafka + aws_msk_iam (aws-msk type does not exist)
apiVersion: keda.sh/v1alpha1
kind: TriggerAuthentication
metadata:
  name: keda-aws-credentials
  namespace: order-service
  annotations:
    localy.io/identity-owner: "workload"
    localy.io/irsa-role: "prod-eks-order-service-irsa-role"
spec:
  podIdentity:
    provider: aws
    identityOwner: workload
---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: order-service-scaler
  namespace: order-service
  annotations:
    localy.io/phase: "5"
spec:
  scaleTargetRef:
    apiVersion: argoproj.io/v1alpha1
    kind: Rollout
    name: order-service
  pollingInterval: 30
  cooldownPeriod: 300
  minReplicaCount: 2
  maxReplicaCount: 10
  advanced:
    horizontalPodAutoscalerConfig:
      behavior:
        scaleUp:
          stabilizationWindowSeconds: 0
          selectPolicy: Max
          policies:
            - type: Percent
              value: 100
              periodSeconds: 15
            - type: Pods
              value: 4
              periodSeconds: 15
        scaleDown:
          stabilizationWindowSeconds: 300
          selectPolicy: Min
          policies:
            - type: Percent
              value: 10
              periodSeconds: 60
  triggers:
    - type: apache-kafka
      metadata:
        bootstrapServers: b-1.prodlocalymsk.d3mxd8.c2.kafka.ap-northeast-2.amazonaws.com:9098,b-2.prodlocalymsk.d3mxd8.c2.kafka.ap-northeast-2.amazonaws.com:9098,b-3.prodlocalymsk.d3mxd8.c2.kafka.ap-northeast-2.amazonaws.com:9098
        topic: payment-result
        consumerGroup: order-payment-result-group
        lagThreshold: "50"
        activationLagThreshold: "10"
        sasl: aws_msk_iam
        tls: enable
        awsRegion: ap-northeast-2
      authenticationRef:
        name: keda-aws-credentials
