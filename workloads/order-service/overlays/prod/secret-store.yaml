# Correction: SecretStore uses SA IRSA only.
# Path scope is enforced by IAM policy on prod-eks-<svc>-irsa-role
# (/localy/prod/workload/<svc>/*) — not by a separate assume-role.
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: platform-secret-store
  namespace: order-service
  annotations:
    localy.io/phase: "7-correction"
    localy.io/allowed-sm-path: "/localy/prod/workload/order-*"
    localy.io/irsa-role: "prod-eks-order-service-irsa-role"
spec:
  provider:
    aws:
      service: SecretsManager
      region: ap-northeast-2
      auth:
        jwt:
          serviceAccountRef:
            name: order-service-sa
