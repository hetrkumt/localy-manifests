# Phase 5 FinOps — LimitRange (Action Order defaults)
apiVersion: v1
kind: LimitRange
metadata:
  name: order-service-limit-range
  namespace: order-service
  annotations:
    localy.io/phase: "5"
spec:
  limits:
    - type: Container
      defaultRequest:
        cpu: 100m
        memory: 256Mi
      default:
        cpu: 500m
        memory: 1Gi
      max:
        cpu: "2000m"
        memory: 2Gi
      min:
        cpu: 50m
        memory: 64Mi
---
# Quota ≥ maxReplicas(10) × container_limit × 1.15 (Agenda 4)
apiVersion: v1
kind: ResourceQuota
metadata:
  name: order-service-quota
  namespace: order-service
  annotations:
    localy.io/phase: "5"
spec:
  hard:
    pods: "12"
    requests.cpu: "3"
    requests.memory: "10Gi"
    limits.cpu: "12"
    limits.memory: "18Gi"
