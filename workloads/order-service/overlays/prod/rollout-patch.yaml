# Phase 4 + Wave 3 — ConfigTree + Zero-Trust patch for Rollout
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: order-service
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  replicas: 2
  template:
    metadata:
      labels:
        security.localy.io/zero-trust: "enforced"
    spec:
      terminationGracePeriodSeconds: 60
      nodeSelector:
        karpenter.sh/nodepool: workload
        kubernetes.io/arch: amd64
      tolerations:
        - key: "workload-only"
          operator: Equal
          value: "true"
          effect: NoSchedule
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: order-service
                topologyKey: kubernetes.io/hostname
      # Tier 2 — AZ + Spot/OD soft spread (ScheduleAnyway avoids small-replica deadlock)
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: order-service
        - maxSkew: 1
          topologyKey: karpenter.sh/capacity-type
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: order-service
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: order-service
          # Keep placeholder so images: transformer can rewrite (Rollout is not
          # in default kustomize strategic-merge schema; patch must carry image).
          image: localy-order-service:latest
          env:
            - name: HOST_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
            - name: JAVA_OPTS
              value: "-XX:MaxRAMPercentage=75.0 -XX:+UseG1GC"
            - name: SPRING_CONFIG_IMPORT
              value: "optional:configtree:/mnt/secrets/app-creds/,optional:configtree:/mnt/config/"
          envFrom: []
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 25"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10001
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: "200m"
              memory: "768Mi"
            limits:
              cpu: "1000m"
              memory: "1536Mi"
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 9090
            failureThreshold: 30
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 9090
            initialDelaySeconds: 0
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 9090
            initialDelaySeconds: 0
            periodSeconds: 10
            failureThreshold: 3
          volumeMounts:
            - name: secret-app-creds
              mountPath: /mnt/secrets/app-creds
              readOnly: true
            - name: config-tree
              mountPath: /mnt/config
              readOnly: true
            - name: tmp-volume
              mountPath: /tmp
            - name: app-logs-volume
              mountPath: /app/logs
      volumes:
        - name: secret-app-creds
          secret:
            secretName: order-service-secret
            defaultMode: 0400
        - name: config-tree
          configMap:
            name: order-service-config
        - name: tmp-volume
          emptyDir:
            medium: Memory
            sizeLimit: 64Mi
        - name: app-logs-volume
          emptyDir:
            medium: Memory
            sizeLimit: 32Mi
        - name: secrets-ram
          emptyDir:
            medium: Memory
            sizeLimit: 8Mi
