apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base
  - pod-disruption-budget.yaml
  - service-monitor.yaml
  - scaled-object.yaml
  - network-policy.yaml
  - configmap.yaml
  - service-account.yaml
  - secret-store.yaml
  - external-secret.yaml
  - resource-guards.yaml
  # Wave 4 — AnalysisTemplate SSOT (namespaced with this overlay)
  - ../../../../common/progressive-delivery

# Image pin SSOT: workloads/image-pins.yaml (keep newTag in sync)
configurations:
  - kustomizeconfig-rollout.yaml
images:
  - name: localy-order-service
    newName: 533003975005.dkr.ecr.ap-northeast-2.amazonaws.com/order-service
    newTag: sha-5fb400ec0c9a

patches:
  - path: rollout-patch.yaml
    target:
      group: argoproj.io
      version: v1alpha1
      kind: Rollout
      name: order-service
