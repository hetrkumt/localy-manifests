# Phase 5 — KEDA SSOT (MSK lag)
# Auth: KEDA assumes workload IRSA via identityOwner=workload
# KEDA 2.14: apache-kafka + aws_msk_iam (aws-msk type does not exist)
apiVersion: keda.sh/v1alpha1
kind: TriggerAuthentication
metadata:
  name: keda-aws-credentials-payment
  namespace: payment-service
  annotations:
    localy.io/identity-owner: "workload"
    localy.io/irsa-role: "prod-eks-payment-service-irsa-role"
spec:
  podIdentity:
    provider: aws
    identityOwner: workload
---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: payment-service-scaler
  namespace: payment-service
  annotations:
    localy.io/phase: "5"
spec:
  scaleTargetRef:
    name: payment-service
  pollingInterval: 30
  cooldownPeriod: 300
  minReplicaCount: 2
  maxReplicaCount: 10
  advanced:
    horizontalPodAutoscalerConfig:
      behavior:
        scaleUp:
          stabilizationWindowSeconds: 0
          selectPolicy: Max
          policies:
            - type: Percent
              value: 100
              periodSeconds: 15
            - type: Pods
              value: 4
              periodSeconds: 15
        scaleDown:
          stabilizationWindowSeconds: 300
          selectPolicy: Min
          policies:
            - type: Percent
              value: 10
              periodSeconds: 60
  triggers:
    - type: apache-kafka
      metadata:
        bootstrapServers: b-1.prodlocalymsk.d3mxd8.c2.kafka.ap-northeast-2.amazonaws.com:9098,b-2.prodlocalymsk.d3mxd8.c2.kafka.ap-northeast-2.amazonaws.com:9098,b-3.prodlocalymsk.d3mxd8.c2.kafka.ap-northeast-2.amazonaws.com:9098
        consumerGroup: payment-approved-group
        topic: order-approved
        lagThreshold: "10"
        activationLagThreshold: "5"
        sasl: aws_msk_iam
        tls: enable
        awsRegion: ap-northeast-2
      authenticationRef:
        name: keda-aws-credentials-payment
