apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: store-service
resources:
  - ../../base
  - pod-disruption-budget.yaml
  - service-monitor.yaml
  - secret-store.yaml
  - external-secret.yaml
  - service-account.yaml
  - configmap.yaml
  - network-policy.yaml
  - scaled-object.yaml
  - resource-guards.yaml
patches:
  - path: deployment-patch.yaml

# Image pin SSOT: workloads/image-pins.yaml (keep newTag in sync)
images:
  - name: localy/store-service
    newName: 533003975005.dkr.ecr.ap-northeast-2.amazonaws.com/store-service
    newTag: e2e2
