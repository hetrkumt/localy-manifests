apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: workloads-root
  namespace: argocd
  annotations:
    localy.io/prune-freeze: "phase-0"
    localy.io/cutover-mode: "legacy-frozen"
    argocd.argoproj.io/sync-options: ServerSideApply=true,Delete=false,Prune=false
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: "https://github.com/hetrkumt/localy-manifests.git"
    targetRevision: HEAD
    path: bootstrap/workload-apps
  destination:
    server: "https://kubernetes.default.svc"
    namespace: argocd
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
      - Delete=false
      - Prune=false
