# Phase 2 — bootstrap KEDA migrated to Multi-Source
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-keda
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
    argocd.argoproj.io/sync-options: ServerSideApply=true,Delete=false,Prune=false
    localy.io/prune-freeze: "phase-0"
    localy.io/packaging: "multi-source"
spec:
  project: default
  sources:
    - repoURL: "https://kedacore.github.io/charts"
      chart: "keda"
      targetRevision: "2.14.0"
      helm:
        releaseName: "keda"
        valueFiles:
          - $values/platform/keda/values-prod.yaml
    - repoURL: "https://github.com/hetrkumt/localy-manifests.git"
      targetRevision: main
      ref: values
  destination:
    server: "https://kubernetes.default.svc"
    namespace: keda
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - Delete=false
      - Prune=false
