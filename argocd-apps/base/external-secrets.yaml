# Phase 2 — Live path migrated to Multi-Source (enable-helm retired)
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-secrets-operator
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
    argocd.argoproj.io/sync-options: ServerSideApply=true,Delete=false,Prune=false
    localy.io/prune-freeze: "phase-0"
    localy.io/packaging: "multi-source"
spec:
  project: default
  sources:
    - repoURL: "https://charts.external-secrets.io"
      chart: "external-secrets"
      targetRevision: "0.9.19"
      helm:
        releaseName: "external-secrets"
        valueFiles:
          - $values/platform/external-secrets-operator/values-prod.yaml
    - repoURL: "https://github.com/hetrkumt/localy-manifests.git"
      targetRevision: main
      ref: values
  destination:
    server: "https://kubernetes.default.svc"
    namespace: external-secrets
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - Delete=false
      - Prune=false
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
