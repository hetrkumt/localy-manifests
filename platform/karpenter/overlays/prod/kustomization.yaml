apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base
  - node-pool.yaml
  - ec2-node-class.yaml

patches:
  # EC2NodeClass node IAM role (IRSA node role name)
  - target:
      group: karpenter.k8s.aws
      version: v1beta1
      kind: EC2NodeClass
      name: default
    patch: |
      - op: replace
        path: /spec/role
        value: localy-prod-karpenter-node-role
