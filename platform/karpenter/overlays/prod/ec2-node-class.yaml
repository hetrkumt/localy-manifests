apiVersion: karpenter.k8s.aws/v1beta1
kind: EC2NodeClass
metadata:
  name: default
spec:
  amiFamily: AL2
  # Prefer TF-managed instance profile (not Karpenter-managed role→profile rebind).
  # After teardown/recreate, role-managed profiles can lag IAM credential propagation
  # and EKS bootstrap fails on aws ec2 describe-instances ("Unable to locate credentials").
  instanceProfile: "prod-eks-karpenter-node-role"
  subnetSelectorTerms:
    - tags:
        # Must match EKS/VPC subnet tags from Terraform
        karpenter.sh/discovery: prod-eks
  securityGroupSelectorTerms:
    - tags:
        karpenter.sh/discovery: prod-eks
  metadataOptions:
    httpTokens: required
    httpPutResponseHopLimit: 2
    httpEndpoint: enabled
    httpProtocolIPv6: disabled
  blockDeviceMappings:
    - deviceName: /dev/xvda
      ebs:
        volumeSize: 50Gi
        volumeType: gp3
        encrypted: true
  tags:
    Environment: "prod"
    ManagedBy: "karpenter"
    localy.io/cost-center: "shared"
    localy.io/finops: "enabled"
