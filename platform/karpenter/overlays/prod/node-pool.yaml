apiVersion: karpenter.sh/v1beta1
kind: NodePool
metadata:
  name: system
  labels:
    localy.io/cost-center: "platform"
    localy.io/finops-pool: "system"
spec:
  template:
    metadata:
      labels:
        role: system
        localy.io/nodepool: system
    spec:
      taints:
        - key: system-only
          value: "true"
          effect: NoSchedule
      requirements:
        - key: karpenter.sh/capacity-type
          operator: In
          values: ["on-demand"]
        - key: kubernetes.io/arch
          operator: In
          values: ["amd64"]
        - key: node.kubernetes.io/instance-type
          operator: In
          values:
            - r6i.large
            - r6a.large
            - m6i.large
            - m6a.large
      nodeClassRef:
        name: default
  disruption:
    consolidationPolicy: WhenUnderutilized
    expireAfter: 336h
  limits:
    cpu: "200"
    memory: "800Gi"

