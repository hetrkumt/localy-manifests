---
apiVersion: karpenter.sh/v1beta1
kind: NodePool
metadata:
  name: workload
  labels:
    localy.io/cost-center: "workload"
    localy.io/finops-pool: "workload"
spec:
  template:
    metadata:
      labels:
        role: workload
        localy.io/nodepool: workload
    spec:
      taints:
        - key: workload-only
          value: "true"
          effect: NoSchedule
      requirements:
        - key: karpenter.sh/capacity-type
          operator: In
          values: ["spot", "on-demand"]
        # Workload images are linux/amd64 only (CI buildx). Do not re-add arm64
        # or Graviton types until multi-arch manifests exist.
        - key: kubernetes.io/arch
          operator: In
          values: ["amd64"]
        - key: node.kubernetes.io/instance-type
          operator: In
          values:
            - c6i.large
            - c6i.xlarge
            - c6i.2xlarge
            - c6a.large
            - c6a.xlarge
            - c6a.2xlarge
            - m6i.large
            - m6i.xlarge
            - m6i.2xlarge
            - m6a.large
            - m6a.xlarge
            - m6a.2xlarge
      nodeClassRef:
        name: default
  disruption:
    consolidationPolicy: WhenUnderutilized
    expireAfter: 168h
  limits:
    cpu: "800"
    memory: "3200Gi"

