# Phase 3 — OTel Gateway Helm values (stateless Deployment, no RWO EBS / Jaeger)
mode: deployment

replicaCount: 2

image:
  repository: otel/opentelemetry-collector-contrib
  tag: "0.98.0"

serviceAccount:
  create: true
  annotations:
    eks.amazonaws.com/role-arn: "arn:aws:iam::533003975005:role/prod-eks-otel-gateway-irsa-role"

resources:
  requests:
    cpu: 200m
    memory: 512Mi
  limits:
    cpu: 1000m
    memory: 1Gi

affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: opentelemetry-collector
          topologyKey: kubernetes.io/hostname

nodeSelector:
  karpenter.sh/nodepool: observability

tolerations:
  - key: observability-only
    operator: Equal
    value: "true"
    effect: NoSchedule

podDisruptionBudget:
  enabled: true
  minAvailable: 1

# Chart config mirrors ConfigMap SSOT (Jaeger exporter fully removed)
config:
  extensions:
    health_check: {}
    sigv4auth:
      region: "ap-northeast-2"
      service: "es"
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318
  processors:
    memory_limiter:
      check_interval: 1s
      limit_percentage: 75
      spike_limit_percentage: 15
    batch:
      send_batch_size: 8192
      timeout: 5s
  exporters:
    opensearch:
      # otelcol-contrib 0.98 has NO traces_index; it always uses
      # ss4o_traces-{dataset}-{namespace} (data stream) when mapping.mode=ss4o.
      # OpenSearch's built-in ss4o_traces_template conflicts with OTel docs
      # (KeywordFieldMapper vs ObjectMapper). We:
      #  1) use an explicit dataset/namespace
      #  2) use flatten_attributes mapping to avoid nested attr clashes
      #  3) rely on SS4O template being removed/replaced in the domain
      dataset: localy
      namespace: traces
      mapping:
        mode: flatten_attributes
      http:
        # VPC endpoint from L3 aws_opensearch_domain.jaeger_backend (private DNS alias TBD)
        endpoint: "https://vpc-prod-jaeger-backend-sanyd6apx4tikocssvd2lbx3le.ap-northeast-2.es.amazonaws.com:443"
        tls:
          insecure: false
        # otelcol-contrib >=0.9x: auth belongs under http (confighttp), not exporter root
        auth:
          authenticator: sigv4auth
  service:
    extensions: [health_check, sigv4auth]
    pipelines:
      traces:
        receivers: [otlp]
        processors: [memory_limiter, batch]
        exporters: [opensearch]
      metrics: null
      logs: null

service:
  enabled: true

ports:
  otlp:
    enabled: true
    containerPort: 4317
    servicePort: 4317
    protocol: TCP
  otlp-http:
    enabled: true
    containerPort: 4318
    servicePort: 4318
    protocol: TCP

autoscaling:
  enabled: false

# No StatefulSet / PVC — in-memory buffering only (Agenda 10)
statefulset:
  volumeClaimTemplates: []
