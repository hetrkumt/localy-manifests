# Same pattern as keycloak-store: ESO controller IRSA reads master RDS creds.
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: workload-dbs-store
  namespace: workload-dbs
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  provider:
    aws:
      service: SecretsManager
      region: ap-northeast-2
