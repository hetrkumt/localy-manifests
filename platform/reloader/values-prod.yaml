# Phase 2 SSOT — Stakater Reloader
# Multi-Source Helm values (enable-helm retired)
#
# Chart quirk (v1.0.69): if deployment.replicas > 1 while enableHA=false, the
# template still adds --enable-ha=true but does NOT inject POD_NAME (or leases
# RBAC). Pods then CrashLoop with "POD_NAME not set, cannot run in HA mode".
# Enable HA only as a pair: enableHA=true AND replicas>=2 (chart then adds
# POD_NAME + coordination.k8s.io/leases).
reloader:
  enableHA: false
  deployment:
    replicas: 1
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 256Mi
  podDisruptionBudget:
    enabled: false
  watchGlobally: true
  reloadStrategy: annotations
