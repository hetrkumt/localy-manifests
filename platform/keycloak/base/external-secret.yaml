apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: keycloak-secrets
  namespace: auth-namespace
  annotations:
    # Must exist (and preferably sync) before keycloak-create-db (wave 1)
    argocd.argoproj.io/sync-wave: "0"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: keycloak-store
    kind: SecretStore
  target:
    name: localy-keycloak-secret
    creationPolicy: Owner
    deletionPolicy: Retain
    # Without template.metadata, ESO copies ExternalSecret labels/annotations
    # onto the Secret — including argocd.argoproj.io/instance — so Argo and
    # ESO both own the Secret and race (SecretSyncedError / optimistic lock).
    template:
      engineVersion: v2
      metadata:
        labels:
          app.kubernetes.io/name: keycloak
          app.kubernetes.io/component: credentials
          app.kubernetes.io/managed-by: external-secrets
        annotations:
          argocd.argoproj.io/compare-options: IgnoreExtraneous
          argocd.argoproj.io/sync-options: Prune=false
      data:
        KEYCLOAK_ADMIN: "{{ .KEYCLOAK_ADMIN }}"
        KEYCLOAK_ADMIN_PASSWORD: "{{ .KEYCLOAK_ADMIN_PASSWORD }}"
        KEYCLOAK_DATABASE_PASSWORD: "{{ .KEYCLOAK_DATABASE_PASSWORD }}"
        KEYCLOAK_DATABASE_HOST: "{{ .KEYCLOAK_DATABASE_HOST }}"
  data:
    - secretKey: KEYCLOAK_ADMIN
      remoteRef:
        key: localy-prod-keycloak-admin
        property: username
    - secretKey: KEYCLOAK_ADMIN_PASSWORD
      remoteRef:
        key: localy-prod-keycloak-admin
        property: password
    - secretKey: KEYCLOAK_DATABASE_PASSWORD
      remoteRef:
        key: localy-prod-database-credentials
        property: password
    - secretKey: KEYCLOAK_DATABASE_HOST
      remoteRef:
        key: localy-prod-database-credentials
        property: host
