# clusterEndpoint SSOT: L2 SSM → ESO → Secret → Karpenter CLUSTER_ENDPOINT env.
# Do not hardcode the EKS API URL in Git (stale after cluster recreate).
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: karpenter-cluster-settings
  namespace: kube-system
  annotations:
    argocd.argoproj.io/sync-wave: "0"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: karpenter-ssm-store
    kind: SecretStore
  target:
    name: karpenter-cluster-settings
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      metadata:
        labels:
          app.kubernetes.io/name: karpenter
          app.kubernetes.io/component: cluster-settings
          app.kubernetes.io/managed-by: external-secrets
        annotations:
          argocd.argoproj.io/compare-options: IgnoreExtraneous
          argocd.argoproj.io/sync-options: Prune=false
      data:
        CLUSTER_ENDPOINT: "{{ .clusterEndpoint }}"
  data:
    - secretKey: clusterEndpoint
      remoteRef:
        key: /localy/prod/eks/cluster_endpoint
