settings:
  clusterName: "prod-eks"
  clusterEndpoint: "https://E583CF0454E256924147D1439D485B87.gr7.ap-northeast-2.eks.amazonaws.com"
  interruptionQueue: "prod-eks-karpenter-interruption-queue"

serviceAccount:
  name: "karpenter"
  annotations:
    eks.amazonaws.com/role-arn: "arn:aws:iam::533003975005:role/prod-eks-karpenter-controller-role"

nodeSelector:
  role: "system"
  karpenter.sh/nodepool: "system"

tolerations:
  - key: "system-only"
    operator: "Equal"
    value: "true"
    effect: "NoSchedule"

serviceMonitor:
  enabled: true
  additionalLabels:
    release: "kube-prometheus-stack"
