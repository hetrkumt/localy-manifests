# Namespace-isolated SecretStore for monitoring (no ClusterSecretStore)
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: platform-secret-store
  namespace: monitoring
  annotations:
    localy.io/phase: "7-correction"
    localy.io/allowed-sm-path: "/localy/prod/platform/grafana*"
spec:
  provider:
    aws:
      service: SecretsManager
      region: ap-northeast-2
      auth:
        jwt:
          serviceAccountRef:
            name: grafana-eso-sa
---
# Phase 0/7: Grafana admin credentials via namespace SecretStore
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: grafana-admin-credentials
  namespace: monitoring
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
    localy.io/phase: "7-correction"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: platform-secret-store
    kind: SecretStore
  target:
    name: grafana-admin-credentials
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: Opaque
      data:
        admin-user: "{{ .adminUser }}"
        admin-password: "{{ .adminPassword }}"
  data:
    - secretKey: adminUser
      remoteRef:
        key: /localy/prod/platform/grafana
        property: admin-user
    - secretKey: adminPassword
      remoteRef:
        key: /localy/prod/platform/grafana
        property: admin-password
