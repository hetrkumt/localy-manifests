apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - network-policy.yaml
  - rbac/role-binding.yaml
  - cert-manager-tls.yaml
  - grafana-eso-sa.yaml
  - grafana-admin-external-secret.yaml
  # Wave 4 — live PrometheusRule / AlertmanagerConfig CRs (not ConfigMap-only)
  - rules/alarm-pipeline.yaml
  - rules/localy-sli-recording-rules.yaml
  - alertmanager/alarm-pipeline.yaml

configMapGenerator:
  - name: grafana-dashboards-custom
    files:
      - dashboards/14361_rev1.json
      - dashboards/alb-traffic.json
      - dashboards/k8s-core-metrics.json
      - dashboards/karpenter-metrics.json
    options:
      labels:
        grafana_dashboard: "1"

  # Keep bytes mirror for operators who inspect ConfigMaps; CR resources are SSOT.
  - name: prometheus-rules-custom
    files:
      - rules/alarm-pipeline.yaml
      - rules/localy-sli-recording-rules.yaml
    options:
      labels:
        prometheus_rule: "1"

  - name: alertmanager-templates
    files:
      - alertmanager/chatops-top3.tmpl
