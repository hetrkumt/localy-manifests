apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: protect-alertmanager-irsa-identity
  annotations:
    policies.kyverno.io/title: Protect Alertmanager IRSA Identity
    policies.kyverno.io/category: DevSecOps
    policies.kyverno.io/severity: high
    # Pod-only: prometheus-operator STS includes init-config-reloader; stale
    # Kyverno autogen controller rules kept denying StatefulSet CREATE after
    # policy updates. Pod admission still Enforce-blocks IRSA hijacking.
    pod-controllers.kyverno.io/autogen-controllers: none
    pod-policies.kyverno.io/autogen-controllers: none
spec:
  validationFailureAction: Enforce
  failurePolicy: Fail
  webhookTimeoutSeconds: 3
  background: true
  rules:
    - name: deny-non-official-alertmanager-images
      match:
        any:
          - resources:
              kinds:
                - Pod
              namespaces:
                - monitoring
              operations:
                - CREATE
                - UPDATE
      preconditions:
        all:
          - key: "{{ request.object.spec.serviceAccountName || '' }}"
            operator: Equals
            value: alarm-pipeline-sns-publisher
      validate:
        message: >-
          Pods with serviceAccountName 'alarm-pipeline-sns-publisher' must only
          use authorized Alertmanager or config-reloader images. IRSA identity
          hijacking is denied.
        anyPattern:
          - spec:
              containers:
                - image: "quay.io/prometheus/alertmanager:* | quay.io/prometheus-operator/prometheus-config-reloader:*"
              =(initContainers):
                - image: "quay.io/prometheus/alertmanager:* | quay.io/prometheus-operator/prometheus-config-reloader:*"
    - name: deny-pinpoint-container-image-mismatch
      match:
        any:
          - resources:
              kinds:
                - Pod
              namespaces:
                - monitoring
              operations:
                - CREATE
                - UPDATE
      preconditions:
        all:
          - key: "{{ request.object.spec.serviceAccountName || '' }}"
            operator: Equals
            value: alarm-pipeline-sns-publisher
      validate:
        message: Container name must match its authorized image (alertmanager, config-reloader, or init-config-reloader only). IRSA identity hijacking is denied.
        foreach:
          # 1. Deny alertmanager container with non-official image
          - list: request.object.spec.containers
            deny:
              conditions:
                all:
                  - key: "{{ element.name }}"
                    operator: Equals
                    value: alertmanager
                  - key: "{{ element.image }}"
                    operator: NotEquals
                    value: quay.io/prometheus/alertmanager:*

          # 2. Deny config-reloader container with non-official image
          - list: request.object.spec.containers
            deny:
              conditions:
                all:
                  - key: "{{ element.name }}"
                    operator: Equals
                    value: config-reloader
                  - key: "{{ element.image }}"
                    operator: NotEquals
                    value: quay.io/prometheus-operator/prometheus-config-reloader:*

          # 3. Deny any other container name on this IRSA SA
          - list: request.object.spec.containers
            deny:
              conditions:
                all:
                  - key: "{{ element.name }}"
                    operator: NotIn
                    value:
                      - alertmanager
                      - config-reloader

          # 4. initContainers: deny alertmanager with non-official image
          - list: "request.object.spec.initContainers || `[]`"
            deny:
              conditions:
                all:
                  - key: "{{ element.name }}"
                    operator: Equals
                    value: alertmanager
                  - key: "{{ element.image }}"
                    operator: NotEquals
                    value: quay.io/prometheus/alertmanager:*

          # 5. initContainers: deny config-reloader / init-config-reloader with non-official image
          # prometheus-operator uses init-config-reloader (same image family as config-reloader).
          - list: "request.object.spec.initContainers || `[]`"
            deny:
              conditions:
                all:
                  - key: "{{ element.name }}"
                    operator: Equals
                    value: config-reloader
                  - key: "{{ element.image }}"
                    operator: NotEquals
                    value: quay.io/prometheus-operator/prometheus-config-reloader:*
          - list: "request.object.spec.initContainers || `[]`"
            deny:
              conditions:
                all:
                  - key: "{{ element.name }}"
                    operator: Equals
                    value: init-config-reloader
                  - key: "{{ element.image }}"
                    operator: NotEquals
                    value: quay.io/prometheus-operator/prometheus-config-reloader:*

          # 6. initContainers: deny any other container name on this IRSA SA
          - list: "request.object.spec.initContainers || `[]`"
            deny:
              conditions:
                all:
                  - key: "{{ element.name }}"
                    operator: NotIn
                    value:
                      - alertmanager
                      - config-reloader
                      - init-config-reloader
