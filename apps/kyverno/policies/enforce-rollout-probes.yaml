# Wave 3 — Audit first; promote to Enforce after Rollout cutover is stable
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: enforce-rollout-probes
  annotations:
    policies.kyverno.io/title: Rollout Fast Probes
    policies.kyverno.io/category: Progressive Delivery
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: Rollout
    localy.io/phase: "wave3"
spec:
  validationFailureAction: Audit
  background: true
  rules:
    - name: require-startup-probe
      match:
        any:
          - resources:
              kinds:
                - Rollout
              namespaces:
                - order-service
                - payment-service
                - cart-service
                - user-service
                - store-service
                - edge-service
      validate:
        message: "Workload Rollouts must define startupProbe so JVM boot does not trip readiness."
        pattern:
          spec:
            template:
              spec:
                containers:
                  - name: "*"
                    startupProbe:
                      httpGet:
                        path: "?*"
    - name: readiness-period-at-most-5s
      match:
        any:
          - resources:
              kinds:
                - Rollout
              namespaces:
                - order-service
                - payment-service
                - cart-service
                - user-service
                - store-service
                - edge-service
      validate:
        message: "readinessProbe.periodSeconds must be <= 5 for fast canary fail-fast."
        foreach:
          - list: "request.object.spec.template.spec.containers[]"
            deny:
              conditions:
                any:
                  - key: "{{ element.readinessProbe.periodSeconds || `60` }}"
                    operator: GreaterThan
                    value: 5
