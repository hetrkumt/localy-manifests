apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: prevent-cross-namespace-secrets
  annotations:
    policies.kyverno.io/title: Prevent Cross-Namespace Secret Exfiltration
    policies.kyverno.io/category: Security
    policies.kyverno.io/severity: high
    policies.kyverno.io/subject: Pod, ExternalSecret
    localy.io/phase: "7-correction"
spec:
  validationFailureAction: Enforce
  background: true
  rules:
    - name: block-clustersecretstore-usage
      match:
        any:
          - resources:
              kinds:
                - ExternalSecret
      validate:
        message: "ExternalSecret must use namespace-isolated SecretStore; ClusterSecretStore is forbidden."
        pattern:
          spec:
            secretStoreRef:
              kind: SecretStore

    - name: block-externalsecret-target-namespace-override
      match:
        any:
          - resources:
              kinds:
                - ExternalSecret
      validate:
        message: "ExternalSecret target namespace override is not allowed."
        deny:
          conditions:
            any:
              - key: "{{ request.object.spec.target.namespace || '' }}"
                operator: NotEquals
                value: ""

    - name: enforce-workload-sm-path-prefix
      match:
        any:
          - resources:
              kinds:
                - ExternalSecret
              namespaces:
                - order-service
                - payment-service
                - cart-service
                - store-service
                - user-service
                - edge-service
      validate:
        message: "ExternalSecret key must be under /localy/prod/workload/<service-prefix>-*."
        foreach:
          - list: "request.object.spec.data || []"
            deny:
              conditions:
                any:
                  # JMESPath has no string '+'; keep workload SM under shared prefix.
                  - key: "{{ starts_with(element.remoteRef.key || '', '/localy/prod/workload/') }}"
                    operator: Equals
                    value: false

    # V72: data[] only was bypassable via dataFrom.extract / find — forbid dataFrom in workload NS
    - name: block-workload-externalsecret-datafrom
      match:
        any:
          - resources:
              kinds:
                - ExternalSecret
              namespaces:
                - order-service
                - payment-service
                - cart-service
                - store-service
                - user-service
                - edge-service
      validate:
        message: "ExternalSecret dataFrom is forbidden in workload namespaces (use spec.data[] with /localy/prod/workload/ prefix)."
        deny:
          conditions:
            any:
              - key: "{{ request.object.spec.dataFrom || `[]` | length(@) }}"
                operator: GreaterThan
                value: 0

    - name: enforce-monitoring-sm-path
      match:
        any:
          - resources:
              kinds:
                - ExternalSecret
              namespaces:
                - monitoring
      validate:
        message: "monitoring ExternalSecret keys must stay under /localy/prod/platform/."
        foreach:
          - list: "request.object.spec.data || []"
            deny:
              conditions:
                any:
                  - key: "{{ starts_with(element.remoteRef.key || '', '/localy/prod/platform/') }}"
                    operator: Equals
                    value: false

    # V72: same bypass class for monitoring platform secrets
    - name: block-monitoring-externalsecret-datafrom
      match:
        any:
          - resources:
              kinds:
                - ExternalSecret
              namespaces:
                - monitoring
      validate:
        message: "ExternalSecret dataFrom is forbidden in monitoring (use spec.data[] under /localy/prod/platform/)."
        deny:
          conditions:
            any:
              - key: "{{ request.object.spec.dataFrom || `[]` | length(@) }}"
                operator: GreaterThan
                value: 0

    - name: block-qualified-secret-names-in-pods
      match:
        any:
          - resources:
              kinds:
                - Pod
      validate:
        message: "Secret references must stay in the local namespace."
        foreach:
          - list: "request.object.spec.volumes[?secret] || []"
            deny:
              conditions:
                any:
                  - key: "{{ contains(element.secret.secretName || '', '/') }}"
                    operator: Equals
                    value: true
          - list: "request.object.spec.containers[].env[?valueFrom.secretKeyRef] || []"
            deny:
              conditions:
                any:
                  - key: "{{ contains(element.valueFrom.secretKeyRef.name || '', '/') }}"
                    operator: Equals
                    value: true
          - list: "request.object.spec.containers[].envFrom[?secretRef] || []"
            deny:
              conditions:
                any:
                  - key: "{{ contains(element.secretRef.name || '', '/') }}"
                    operator: Equals
                    value: true
