apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: kyverno-admission-ingress-zero-trust
  namespace: kyverno
  labels:
    app.kubernetes.io/name: kyverno
    app.kubernetes.io/component: network-policy
    managed-by: argocd
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: admission-controller
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Control plane / node CIDRs to admission webhook
    - from:
        - ipBlock:
            cidr: 10.0.11.0/24
        - ipBlock:
            cidr: 10.0.12.0/24
        - ipBlock:
            cidr: 10.0.13.0/24
      ports:
        - protocol: TCP
          port: 9443
    # Kyverno internal components
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/part-of: kyverno
      ports:
        - protocol: TCP
          port: 9443
  egress:
    # Kubernetes API server
    - to:
        - ipBlock:
            cidr: 10.100.0.1/32
      ports:
        - protocol: TCP
          port: 443
    # CoreDNS
    - to:
        - namespaceSelector:
            matchExpressions:
              - key: kubernetes.io/metadata.name
                operator: In
                values:
                  - kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
