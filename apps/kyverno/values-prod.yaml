# Kyverno Helm values (prod) — referenced by Multi-Source Application
# Policies (ClusterPolicy) sync via apps/kyverno kustomize path (3rd source).
replicaCount: 2

resources:
  limits:
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 256Mi

admissionController:
  replicas: 2

backgroundController:
  replicas: 1

reportsController:
  replicas: 1

# Chart 3.3.x defaults to bitnami/kubectl:1.30.2 which was removed from Docker Hub.
# Pin to the cluster-aligned official kubectl image for hook Jobs.
webhooksCleanup:
  image:
    registry: registry.k8s.io
    repository: kubectl
    tag: v1.30.14

policyReportsCleanup:
  image:
    registry: registry.k8s.io
    repository: kubectl
    tag: v1.30.14
