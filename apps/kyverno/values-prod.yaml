# Kyverno Helm values (prod) — referenced by Multi-Source Application
# Policies (ClusterPolicy) sync via apps/kyverno kustomize path (3rd source).
replicaCount: 2

resources:
  limits:
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 256Mi

admissionController:
  replicas: 2
  rbac:
    serviceAccount:
      annotations:
        eks.amazonaws.com/role-arn: "arn:aws:iam::533003975005:role/prod-eks-kyverno-ecr-irsa-role"

backgroundController:
  replicas: 1
  rbac:
    serviceAccount:
      annotations:
        eks.amazonaws.com/role-arn: "arn:aws:iam::533003975005:role/prod-eks-kyverno-ecr-irsa-role"

reportsController:
  replicas: 1
  rbac:
    serviceAccount:
      annotations:
        eks.amazonaws.com/role-arn: "arn:aws:iam::533003975005:role/prod-eks-kyverno-ecr-irsa-role"

# Chart hooks exec /bin/bash. registry.k8s.io/kubectl is distroless (no shell).
# bitnami/kubectl:1.30.2 was removed from Docker Hub; use the legacy mirror.
webhooksCleanup:
  image:
    registry: docker.io
    repository: bitnamilegacy/kubectl
    tag: "1.30.2"

# One-shot post-upgrade report cleanup is optional for bring-up; disable to
# avoid hook Job noise. Re-enable with the bitnamilegacy image if needed.
policyReportsCleanup:
  enabled: false
