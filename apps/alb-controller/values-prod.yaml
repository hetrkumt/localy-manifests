# clusterName + IRSA: LBC auto-discovers VPC (do not pin vpcId — drifts after teardown/redeploy).
clusterName: "prod-eks"
region: "ap-northeast-2"

serviceAccount:
  create: true
  name: "aws-load-balancer-controller"
  annotations:
    eks.amazonaws.com/role-arn: "arn:aws:iam::533003975005:role/AWSLoadBalancerControllerIAMRole-prod"

serviceMonitor:
  enabled: false
