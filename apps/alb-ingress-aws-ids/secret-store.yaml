# Shared SSM store for ALB Ingress ACM/WAF ARNs (ESO controller IRSA).
# Option A: no auth.jwt — uses external-secrets/external-secrets IRSA.
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: alb-ingress-ssm-store
  namespace: kube-system
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
    localy.io/phase: "eso-inject-s2"
spec:
  provider:
    aws:
      service: ParameterStore
      region: ap-northeast-2
