# SSOT: TF → SSM → ESO → Secret (no ACM/WAF ARN literals in this file).
# Consumers (Stage 3): Kyverno mutates Ingress annotations from this Secret.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: alb-ingress-aws-ids
  namespace: kube-system
  annotations:
    argocd.argoproj.io/sync-wave: "0"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    localy.io/phase: "eso-inject-s2"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: alb-ingress-ssm-store
    kind: SecretStore
  target:
    name: alb-ingress-aws-ids
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      metadata:
        labels:
          app.kubernetes.io/name: alb-ingress-aws-ids
          app.kubernetes.io/managed-by: external-secrets
          localy.io/purpose: alb-annotation-source
        annotations:
          argocd.argoproj.io/compare-options: IgnoreExtraneous
          argocd.argoproj.io/sync-options: Prune=false
      data:
        acm-arn: "{{ .acmArn }}"
        waf-arn: "{{ .wafArn }}"
  data:
    - secretKey: acmArn
      remoteRef:
        key: /localy/prod/apps/acm/cert_arn
    - secretKey: wafArn
      remoteRef:
        key: /localy/prod/apps/waf/arn
