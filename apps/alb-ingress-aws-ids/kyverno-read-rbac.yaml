# Kyverno admission must read the shared ARN Secret for Stage-3 mutate apiCall.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: kyverno-read-alb-ingress-aws-ids
  namespace: kube-system
  annotations:
    localy.io/phase: "eso-inject-s3"
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["alb-ingress-aws-ids"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kyverno-read-alb-ingress-aws-ids
  namespace: kube-system
  annotations:
    localy.io/phase: "eso-inject-s3"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: kyverno-read-alb-ingress-aws-ids
subjects:
  - kind: ServiceAccount
    name: kyverno-admission-controller
    namespace: kyverno
