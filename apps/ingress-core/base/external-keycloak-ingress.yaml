apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: localy-external-alb-keycloak
  namespace: auth-namespace
  annotations:
    kubernetes.io/ingress.class: "alb"
    alb.ingress.kubernetes.io/scheme: "internet-facing"
    alb.ingress.kubernetes.io/group.name: "localy-external-alb"
    alb.ingress.kubernetes.io/group.order: "10"
    alb.ingress.kubernetes.io/target-type: "ip"
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}, {"HTTPS":443}]'
    alb.ingress.kubernetes.io/ssl-redirect: "443"
    alb.ingress.kubernetes.io/certificate-arn: "arn:aws:acm:ap-northeast-2:533003975005:certificate/691f8d34-4153-4541-b3d4-ebf10bb9292a"
    alb.ingress.kubernetes.io/wafv2-acl-arn: "arn:aws:wafv2:ap-northeast-2:533003975005:regional/webacl/prod-ingress-waf/7aec41cf-e821-4521-82df-f1eabaf0402f"
    # Readiness-gate injection is a Namespace label (auth-namespace), not an Ingress annotation.
spec:
  rules:
    - host: "feifo.click"
      http:
        paths:
          - path: "/auth"
            pathType: "Prefix"
            backend:
              service:
                name: "keycloak"
                port:
                  number: 80

