apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: localy-external-alb-keycloak
  namespace: auth-namespace
  annotations:
    kubernetes.io/ingress.class: "alb"
    alb.ingress.kubernetes.io/scheme: "internet-facing"
    alb.ingress.kubernetes.io/group.name: "localy-external-alb"
    alb.ingress.kubernetes.io/group.order: "10"
    alb.ingress.kubernetes.io/target-type: "ip"
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}, {"HTTPS":443}]'
    alb.ingress.kubernetes.io/ssl-redirect: "443"
    alb.ingress.kubernetes.io/certificate-arn: "arn:aws:acm:ap-northeast-2:533003975005:certificate/9c6d9adb-1dae-453d-bd05-2574a93820de"
    alb.ingress.kubernetes.io/wafv2-acl-arn: "arn:aws:wafv2:ap-northeast-2:533003975005:regional/webacl/prod-ingress-waf/a5da2535-03bf-424c-9d52-82f152c9047d"
    # Readiness-gate injection is a Namespace label (auth-namespace), not an Ingress annotation.
spec:
  rules:
    - host: "feifo.click"
      http:
        paths:
          - path: "/auth"
            pathType: "Prefix"
            backend:
              service:
                name: "keycloak"
                port:
                  number: 80

