apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: localy-internal-alb-edge
  namespace: edge-service
  annotations:
    kubernetes.io/ingress.class: "alb"
    alb.ingress.kubernetes.io/scheme: "internal"
    alb.ingress.kubernetes.io/group.name: "localy-internal-alb"
    alb.ingress.kubernetes.io/group.order: "10"
    alb.ingress.kubernetes.io/target-type: "ip"
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}, {"HTTPS":443}]'
    alb.ingress.kubernetes.io/ssl-redirect: "443"
    alb.ingress.kubernetes.io/healthcheck-path: "/actuator/health/readiness"
    alb.ingress.kubernetes.io/healthcheck-port: "9090"
    alb.ingress.kubernetes.io/success-codes: "200"
    alb.ingress.kubernetes.io/certificate-arn: "arn:aws:acm:ap-northeast-2:533003975005:certificate/691f8d34-4153-4541-b3d4-ebf10bb9292a"
spec:
  rules:
    - host: "internal.feifo.click"
      http:
        paths:
          - path: "/"
            pathType: "Prefix"
            backend:
              service:
                name: "edge-service"
                port:
                  number: 80

