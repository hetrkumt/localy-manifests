apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: localy-internal-alb-edge
  namespace: edge-service
  annotations:
    kubernetes.io/ingress.class: "alb"
    alb.ingress.kubernetes.io/scheme: "internal"
    alb.ingress.kubernetes.io/group.name: "localy-internal-alb"
    alb.ingress.kubernetes.io/group.order: "10"
    alb.ingress.kubernetes.io/target-type: "ip"
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}, {"HTTPS":443}]'
    alb.ingress.kubernetes.io/ssl-redirect: "443"
    alb.ingress.kubernetes.io/certificate-arn: "arn:aws:acm:ap-northeast-2:533003975005:certificate/6f155ea4-0e3c-4d7f-a2d4-652d1dfe263b"
    # Do not publish this internal ALB to public Route53 (same host as external).
    external-dns.alpha.kubernetes.io/exclude: "true"
spec:
  rules:
    - host: "internal.feifo.click"
      http:
        paths:
          - path: "/"
            pathType: "Prefix"
            backend:
              service:
                name: "edge-service"
                port:
                  number: 80

