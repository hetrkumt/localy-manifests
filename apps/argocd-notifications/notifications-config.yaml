# Wave 4 — Argo CD Notifications config (controller enabled in l4-bootstrap)
# Secret is owned by ESO (argocd-notifications-secret); chart secret.create=false.
apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-notifications-cm
  namespace: argocd
  labels:
    localy.io/phase: "wave4"
    app.kubernetes.io/part-of: argocd-notifications
data:
  service.webhook.chatops-slack: |
    url: $slack-webhook-url
    headers:
    - name: Content-Type
      value: application/json
  template.app-sync-succeeded: |
    webhook:
      chatops-slack:
        method: POST
        body: |
          {
            "text": ":white_check_mark: ArgoCD sync succeeded — {{.app.metadata.name}} ({{.app.spec.destination.namespace}})"
          }
  template.app-health-degraded: |
    webhook:
      chatops-slack:
        method: POST
        body: |
          {
            "text": ":warning: ArgoCD health degraded — {{.app.metadata.name}} status={{.app.status.health.status}}"
          }
  template.app-sync-failed: |
    webhook:
      chatops-slack:
        method: POST
        body: |
          {
            "text": ":x: ArgoCD sync failed — {{.app.metadata.name}}"
          }
  trigger.on-sync-succeeded: |
    - when: app.status.operationState.phase in ['Succeeded']
      send: [app-sync-succeeded]
  trigger.on-health-degraded: |
    - when: app.status.health.status == 'Degraded'
      send: [app-health-degraded]
  trigger.on-sync-failed: |
    - when: app.status.operationState.phase in ['Error', 'Failed']
      send: [app-sync-failed]
  subscriptions: |
    - recipients:
      - chatops-slack
      triggers:
      - on-sync-succeeded
      - on-health-degraded
      - on-sync-failed
---
# Namespace SecretStore for argocd notifications webhook (reuse ChatOps SM)
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: argocd-notifications-secret-store
  namespace: argocd
  annotations:
    localy.io/phase: "wave4"
    localy.io/allowed-sm-path: "prod-chatops-slack-webhook*"
spec:
  provider:
    aws:
      service: SecretsManager
      region: ap-northeast-2
      auth:
        jwt:
          serviceAccountRef:
            name: argocd-notifications-eso-sa
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: argocd-notifications-eso-sa
  namespace: argocd
  annotations:
    localy.io/phase: "wave4"
    # Wire IRSA after cluster bring-up (l3/l2): prod-eks-argocd-notifications-eso-role
    # eks.amazonaws.com/role-arn: arn:aws:iam::533003975005:role/prod-eks-argocd-notifications-eso-role
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: argocd-notifications-secret
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
    localy.io/phase: "wave4"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: argocd-notifications-secret-store
    kind: SecretStore
  target:
    name: argocd-notifications-secret
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: Opaque
      data:
        # Chart expects slack-webhook-url key for $slack-webhook-url substitution
        slack-webhook-url: "{{ .webhookUrl }}"
  data:
    - secretKey: webhookUrl
      remoteRef:
        # Existing ChatOps webhook secret name (see lambda_chatops.tf data source)
        key: prod-chatops-slack-webhook
