# Synced from live — edge oauth path isolated
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: gateway-oauth-secrets
  namespace: edge-service
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
    localy.io/phase: "7-correction"
    localy.io/domain-alias: "gateway-service"
    localy.io/sm-migration: "from:/localy/prod/workload/jwt-secret#edgeClientSecret"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: platform-secret-store
    kind: SecretStore
  target:
    name: edge-service-oauth-secret
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      data:
        spring.security.oauth2.client.registration.edge-service.client-secret: "{{ .clientSecret }}"
        keycloak.client-secret: "{{ .clientSecret }}"
  data:
    - secretKey: clientSecret
      remoteRef:
        key: /localy/prod/workload/edge-oauth
        property: clientSecret
