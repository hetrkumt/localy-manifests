apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cart-service
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "20"
    localy.io/phase: "8"
    localy.io/cutover-mode: "gate-8a"
spec:
  project: workload-project
  source:
    repoURL: "https://github.com/hetrkumt/localy-manifests.git"
    targetRevision: main
    path: workloads/cart-service/overlays/prod
  destination:
    server: "https://kubernetes.default.svc"
    namespace: cart-service
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - RespectIgnoreDifferences=true
  ignoreDifferences:
    - group: apps
      kind: Deployment
      jsonPointers:
        - /spec/replicas
    - group: external-secrets.io
      kind: ExternalSecret
      jqPathExpressions:
        - .status
        - .metadata.annotations["force-sync"]
        - .spec.data[].remoteRef.conversionStrategy
        - .spec.data[].remoteRef.decodingStrategy
        - .spec.data[].remoteRef.metadataPolicy
        - .spec.target.template.mergePolicy
    - group: ""
      kind: Secret
      jqPathExpressions:
        - .data
        - .metadata
        - .type
