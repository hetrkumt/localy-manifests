# Synced from live — user oauth path isolated
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: user-jwt-secrets
  namespace: user-service
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
    localy.io/phase: "7-correction"
    localy.io/sm-migration: "from:/localy/prod/workload/jwt-secret#clientSecret"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: platform-secret-store
    kind: SecretStore
  target:
    name: localy-user-keycloak-secret
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      data:
        KEYCLOAK_CLIENT_SECRET: "{{ .clientSecret }}"
        keycloak.client-secret: "{{ .clientSecret }}"
        spring.security.oauth2.client.registration.keycloak.client-secret: "{{ .clientSecret }}"
  data:
    - secretKey: clientSecret
      remoteRef:
        key: /localy/prod/workload/user-oauth
        property: clientSecret
