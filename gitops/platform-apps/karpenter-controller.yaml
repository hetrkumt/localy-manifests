# Phase 8 — Karpenter controller (Wave -3)
# Multi-source: Helm chart + (values ref AND ESO cluster-settings on same git source).
# Combining ref+path avoids Argo 2.9 empty-path ref source / nil-pointer sync errors.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: karpenter-controller
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
    argocd.argoproj.io/sync-options: ServerSideApply=true,Delete=false,Prune=false
    localy.io/phase: "8"
    localy.io/cutover-mode: "gate-8a"
spec:
  project: platform-project
  sources:
    - repoURL: "public.ecr.aws/karpenter"
      chart: "karpenter"
      targetRevision: "0.37.0"
      helm:
        releaseName: "karpenter"
        valueFiles:
          - $values/apps/karpenter/values-prod.yaml
    - repoURL: "https://github.com/hetrkumt/localy-manifests.git"
      targetRevision: main
      ref: values
      path: apps/karpenter/cluster-settings
  destination:
    server: "https://kubernetes.default.svc"
    namespace: kube-system
  ignoreDifferences:
    - group: ""
      kind: Secret
      name: karpenter-cluster-settings
      jqPathExpressions:
        - .data
        - .metadata
        - .type
    - group: external-secrets.io
      kind: ExternalSecret
      jqPathExpressions:
        - .status
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - Delete=false
      - Prune=false
      - RespectIgnoreDifferences=true
