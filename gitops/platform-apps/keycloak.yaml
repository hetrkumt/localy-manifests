# Phase 2/8 Multi-Source — Keycloak (Ingress & Auth band, Wave 12)
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: keycloak
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "12"
    argocd.argoproj.io/sync-options: ServerSideApply=true,Delete=false,Prune=false
    localy.io/phase: "8"
    localy.io/cutover-mode: "gate-8a"
spec:
  project: platform-project
  sources:
    - repoURL: "registry-1.docker.io/bitnamicharts"
      chart: "keycloak"
      targetRevision: "24.7.7"
      helm:
        releaseName: "keycloak"
        valueFiles:
          - $values/platform/keycloak/overlays/prod/values.yaml
    - repoURL: "https://github.com/hetrkumt/localy-manifests.git"
      targetRevision: main
      ref: values
    - repoURL: "https://github.com/hetrkumt/localy-manifests.git"
      targetRevision: main
      path: platform/keycloak/overlays/prod
  destination:
    server: "https://kubernetes.default.svc"
    namespace: auth-namespace
  # ESO-managed Secret must not be reconciled by Argo (label was previously
  # copied from ExternalSecret → dual-writer / SecretSyncedError).
  ignoreDifferences:
    - group: ""
      kind: Secret
      name: localy-keycloak-secret
      jqPathExpressions:
        - .data
        - .metadata
        - .type
    - group: external-secrets.io
      kind: ExternalSecret
      jqPathExpressions:
        - .status
        - .metadata.annotations["force-sync"]
        - .spec.data[].remoteRef.conversionStrategy
        - .spec.data[].remoteRef.decodingStrategy
        - .spec.data[].remoteRef.metadataPolicy
        - .spec.target.template.mergePolicy
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - Delete=false
      - Prune=false
      - RespectIgnoreDifferences=true
