# Phase 2/8 Multi-Source — Keycloak (Ingress & Auth band, Wave 12)
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: keycloak
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "12"
    argocd.argoproj.io/sync-options: ServerSideApply=true,Delete=false,Prune=false
    localy.io/phase: "8"
    localy.io/cutover-mode: "gate-8a"
spec:
  project: platform-project
  sources:
    - repoURL: "registry-1.docker.io/bitnamicharts"
      chart: "keycloak"
      targetRevision: "24.7.7"
      helm:
        releaseName: "keycloak"
        valueFiles:
          - $values/platform/keycloak/overlays/prod/values.yaml
    - repoURL: "https://github.com/hetrkumt/localy-manifests.git"
      targetRevision: main
      ref: values
    - repoURL: "https://github.com/hetrkumt/localy-manifests.git"
      targetRevision: main
      path: platform/keycloak/overlays/prod
  destination:
    server: "https://kubernetes.default.svc"
    namespace: auth-namespace
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - Delete=false
      - Prune=false
