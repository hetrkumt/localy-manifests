# Phase 8 — Loki (Observability band, Wave 2)
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: loki
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
    argocd.argoproj.io/sync-options: ServerSideApply=true,Delete=false,Prune=false
    localy.io/phase: "8"
    localy.io/cutover-mode: "gate-8a"
spec:
  project: platform-project
  sources:
    - repoURL: "https://grafana.github.io/helm-charts"
      chart: "loki"
      targetRevision: "5.47.2"
      helm:
        releaseName: "loki"
        valueFiles:
          - $values/apps/loki/values-prod.yaml
    - repoURL: "https://github.com/hetrkumt/localy-manifests.git"
      targetRevision: main
      ref: values
    - repoURL: "https://github.com/hetrkumt/localy-manifests.git"
      targetRevision: main
      path: apps/loki
  destination:
    server: "https://kubernetes.default.svc"
    namespace: loki
  # If agent-operator CRDs ever reappear in desired state, do not overwrite
  # cluster prometheus-operator CRD schemas.
  ignoreDifferences:
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
      name: servicemonitors.monitoring.coreos.com
      jqPathExpressions:
        - .spec.versions
        - .spec.conversion
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
      name: podmonitors.monitoring.coreos.com
      jqPathExpressions:
        - .spec.versions
        - .spec.conversion
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
      name: probes.monitoring.coreos.com
      jqPathExpressions:
        - .spec.versions
        - .spec.conversion
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - Delete=false
      - Prune=false
      - RespectIgnoreDifferences=true
