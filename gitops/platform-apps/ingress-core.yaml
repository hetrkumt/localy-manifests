# Phase 8 — Ingress Core / 2-Tier ALB (Ingress & Auth band, Wave 10)
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ingress-core
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "10"
    argocd.argoproj.io/sync-options: ServerSideApply=true,Delete=false,Prune=false
    localy.io/phase: "8"
    localy.io/cutover-mode: "gate-8a"
spec:
  project: platform-project
  source:
    repoURL: "https://github.com/hetrkumt/localy-manifests.git"
    path: apps/ingress-core/overlays/prod
    targetRevision: main
  destination:
    server: "https://kubernetes.default.svc"
    namespace: default
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - Delete=false
      - Prune=false
