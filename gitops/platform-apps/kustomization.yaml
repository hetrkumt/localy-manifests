  - argocd-notifications.yaml
  # Core controllers (-9 ~ 0)
  - alb-controller.yaml
  - storage.yaml
  - external-secrets.yaml
  - node-local-dns.yaml
  - karpenter-controller.yaml
  - karpenter-provisioner.yaml
  - argo-rollouts.yaml
  - keda.yaml
  - reloader.yaml
  # Observability (1 ~ 9)
  - kube-prometheus-stack.yaml
  - loki.yaml
  - otel-gateway.yaml
  - fluent-bit.yaml
  # Ingress & Auth (10 ~ 19)
  - ingress-core.yaml
  - external-dns.yaml
  - keycloak.yaml
  # Logical DBs before workloads (wave 15 < workload apps wave 20)
  - workload-dbs.yaml
