# Observability prerequisite — monitoring.coreos.com CRDs before kube-prometheus-stack
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: prometheus-operator-crds
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
    argocd.argoproj.io/sync-options: ServerSideApply=true,Delete=false,Prune=false
    localy.io/phase: "8"
    localy.io/cutover-mode: "gate-8a"
spec:
  project: platform-project
  source:
    repoURL: "https://github.com/hetrkumt/localy-manifests.git"
    path: apps/prometheus-operator-crds
    targetRevision: main
  destination:
    server: "https://kubernetes.default.svc"
    namespace: monitoring
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - Delete=false
      - Prune=false
