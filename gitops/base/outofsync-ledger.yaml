# Argo OutOfSync known causes & intentional ignores (Gate 8A)
#
# False positives fixed by Application ignoreDifferences (backlog #6):
#   - ExternalSecret: API-defaulted remoteRef fields + .status + force-sync annotation
#   - Secret: ESO-owned .data/.metadata
#   - Deployment /spec/replicas: KEDA
#   - Root Application children: .status/.operation/refresh annotation
#
# Live cleanup (not in Git):
#   - Never leave force-sync annotations on ExternalSecrets (causes OutOfSync)
#   - Reloader PDB must stay disabled while enableHA=false (delete orphan PDB)
#
# Deferred:
#   - kube-prometheus-stack Unknown (CRD schema diff / trackTimestampsStaleness)
#   - kyverno Unknown health → observe
#
# Done:
#   - backlog #7 ingress-core: Synced/Healthy; feifo.click → external ALB;
#     internal edge host = internal.feifo.click (avoids ED collision)
#   - backlog #8 platform SM: /localy/prod/platform/grafana via secrets_platform.tf;
#     Grafana ESO SecretSynced (KPS app may still show Unknown from CRD schema)
#   - backlog #9 karpenter OutOfSync/orphans: platform-project orphan warn off
#     (kube-system false positives); provisioner dest ns=karpenter;
#     ignoreDifferences widened for hash/managedFields
apiVersion: v1
kind: ConfigMap
metadata:
  name: localy-argocd-outofsync-ledger
  namespace: argocd
  labels:
    localy.io/ledger: "argocd-outofsync"
    localy.io/phase: "8"
data:
  summary: |
    Backlog #6 — workload + ESO OutOfSync false positives cleared (Synced).
    Backlog #7 — ingress-core Synced/Healthy; public DNS on external ALB.
    Backlog #8 — platform Grafana SM SSOT + ESO SecretSynced.
    Backlog #9 — karpenter-provisioner Synced; orphan warn noise cleared.
  ignore_policy: |
    RespectIgnoreDifferences=true on workload apps, keycloak, workload-dbs,
    karpenter-*, root-platform, root-workloads.
    platform-project orphanedResources.warn=false (kube-system apps).
  verified_synced: |
    order/payment/cart/user/product/gateway, keycloak, workload-dbs,
    reloader, karpenter-controller, karpenter-provisioner,
    root-platform, root-workloads, root-app-of-apps, ingress-core
  