# Gate 8A Root — Platform App of Apps
# prune=false / selfHeal=true until Gate 8B soak. Physical archive deferred to Go-Live (8C).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root-platform
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-options: ServerSideApply=true,Delete=false,Prune=false
    argocd.argoproj.io/sync-wave: "-8"
    localy.io/cutover-mode: "gate-8a"
    localy.io/phase: "8"
spec:
  project: platform-project
  source:
    repoURL: "https://github.com/hetrkumt/localy-manifests.git"
    targetRevision: main
    path: gitops/platform-apps
  destination:
    server: "https://kubernetes.default.svc"
    namespace: argocd
  ignoreDifferences:
    - group: argoproj.io
      kind: Application
      jqPathExpressions:
        - .status
        - .operation
        - .metadata.annotations["argocd.argoproj.io/refresh"]
      jsonPointers:
        - /status
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - ApplyOutOfSyncOnly=true
      - RespectIgnoreDifferences=true
